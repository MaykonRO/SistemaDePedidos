<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereço</title>
    <link rel="stylesheet" href="../css/navBarStyle.css">
    <link rel="stylesheet" href="../css/comunStyle.css">
    <link rel="stylesheet" href="../css/enderecoStyle.css">
</head>

<body>
    <div class="container">
        <h1>Endereço</h1>

<form action="" method="get">
            <div>
                <label for="cep">Cep: </label>
                <input type="text" name="cep" id="cep" placeholder="00000-000">
                <button type="button" id="buttonCep">Pesquisar</button>
            </div>
            <div>
                <label for="rua">Rua: </label>
                <input type="text" name="rua" id="rua" placeholder="Digite sua rua">
            </div>
            <div>
                <label for="numero">Número: </label>
                <input type="text" name="numero" id="numero" placeholder="0000">
            </div>
            <div>
                <label for="referencia">Número da rua/Ponto de referência: </label>
                <input type="text" name="referencia" id="referencia" placeholder="Antiga Rua 1">
            </div>
            <div>
                <label for="complemento">Complemento: </label>
                <input type="text" name="complemento" id="complemento" placeholder="Apto, Bloco, etc.">
            </div>
            <div>
                <label for="bairro">Bairro: </label>
                <input type="text" name="bairro" id="bairro" placeholder="Digite seu bairro">
            </div>
            <div>
                <label for="cidade">Cidade: </label>
                <input type="text" name="cidade" id="cidade" placeholder="Digite sua cidade">
            </div>
        </form>

        <div class="barra-inferior">
            <button class="botao-navegacao" type="button" id="btnHome" data-url="../index.html">
                <img src="../img/icons/home.svg" alt="" srcset="" class="icons">
            </button>

            <button class="botao-navegacao" type="button" id="btnCarrinho" data-url="carrinho.html">
                <img src="../img/icons/shopping-cart.svg" alt="" srcset="" class="icons">
            </button>

            <button class="botao-navegacao" type="button" id="btnPin" data-url="endereco.html">
                <img src="../img/icons/map-pin.svg" alt="" srcset="" class="icons">
            </button>

            <button class="botao-navegacao" type="button" id="btnPhone" data-url="celular.html">
                <img src="../img/icons/cellphone.svg" alt="" srcset="" class="icons">
            </button>

            <button class="botao-navegacao" type="button" id="btnPayment" data-url="pagamento.html">
                <img src="../img/icons/payment-methodsvg.svg" alt="" srcset="" class="icons">
            </button>
        </div>
    </div>

    <script src="../js/navBarScript.js"></script>
    <script src="../js/enderecoScript.js"></script>
</body>

</html>
